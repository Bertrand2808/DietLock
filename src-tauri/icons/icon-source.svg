<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fc58a"/>
      <stop offset="1" stop-color="#0b6b4d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff5ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04382a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 shape centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- shackle -->
    <path d="M394 470 V372 a118 118 0 0 1 236 0 V470" fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round"/>
    <!-- body -->
    <rect x="322" y="450" width="380" height="316" rx="64" fill="url(#body)"/>
  </g>
  <!-- trend curve inside the lock body -->
  <path d="M386 690 C450 690 480 640 520 604 S590 556 636 540" fill="none" stroke="#0b6b4d" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="636" cy="540" r="28" fill="#0b6b4d"/>
</svg>
