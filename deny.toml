[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# Per-crate exceptions: any new dependency outside this list fails CI.
[[licenses.exceptions]]
# Pulled in by tauri-utils and wry, via dom_query.
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Pulled in by tauri-utils and wry, via cssparser.
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Pulled in by tauri-utils and wry, via cssparser.
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Pulled in by tauri-utils and wry, via dom_query.
crate = "selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Pulled in by tauri, via dirs then dirs-sys.
crate = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Pulled in by the GTK bindings (Linux), via system-deps then cfg-expr.
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]
